*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:#dff3ff}

.ov{position:absolute;inset:0;padding-top:56px !important;display:none;background:rgba(2,2,14,.86);overflow:auto;z-index:5;padding:12px;text-align:center;touch-action:pan-y}
.ov.show{display:flex}
.ov.lite{background:rgba(2,2,14,.38)}
#daily,#lang{z-index:8}
.ar .ov *{letter-spacing:0 !important}
.btn.sel{background:rgba(var(--acr),.28);color:#fff}
.in{margin:auto;max-width:900px;width:100%}
h1{font-size:clamp(34px,9vw,84px);line-height:.95;margin:0;letter-spacing:.12em;color:#fff;text-shadow:0 0 12px var(--ac),0 0 32px var(--ac2),0 0 64px var(--ac2)}
h2{margin:6px 0 10px;letter-spacing:.3em;color:var(--ac2);text-shadow:0 0 14px var(--ac2);font-size:clamp(14px,3vw,26px)}
h3{margin:16px 0 8px;letter-spacing:.3em;color:var(--ac);text-shadow:0 0 10px var(--ac);font-size:14px}
.sub,.help,small{color:#8fb0cc;font-size:13px}
.help{max-width:560px;margin:14px auto 0;line-height:1.6}
.btn{font:700 15px "Trebuchet MS",system-ui,sans-serif;letter-spacing:.2em;color:var(--ac);background:rgba(var(--acr),.07);border:2px solid var(--ac);border-radius:6px;padding:12px 22px;margin:6px;cursor:pointer;text-shadow:0 0 8px var(--ac);box-shadow:0 0 14px rgba(var(--acr),.35),inset 0 0 12px rgba(var(--acr),.15);transition:.12s}

.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.big{font-size:21px;padding:17px 40px;color:#fff;border-color:var(--ac2);text-shadow:0 0 10px var(--ac2);box-shadow:0 0 22px rgba(var(--ac2r),.6),inset 0 0 14px rgba(var(--ac2r),.25)}

.btn.sm{padding:7px 14px;font-size:12px;margin:6px 0 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:8px 0}
.card{background:rgba(20,30,60,.55);border:1px solid #234;border-radius:8px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:4px}
.card.sel{border-color:var(--ac);box-shadow:0 0 14px rgba(var(--acr),.5)}
.pips{display:flex;gap:3px;margin:4px 0}
.pips i{width:12px;height:6px;border:1px solid var(--ac);border-radius:2px}
.pips i.on{background:var(--ac);box-shadow:0 0 6px var(--ac)}
.sw{width:54px;height:54px;border-radius:50%;box-shadow:0 0 18px currentColor}
.cr{font-size:24px;color:#ffd23a;text-shadow:0 0 12px #ffd23a;margin:4px 0;letter-spacing:.1em}
.best{font-size:20px;color:#ffd23a;text-shadow:0 0 10px #ffd23a;margin:10px 0;letter-spacing:.12em}
.sum{color:#cfe8ff;margin:8px 0 12px;font-size:16px;line-height:1.7}
.sum b{color:#fff;font-size:22px}
.gold{color:#ffd23a}
.pop{animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
</style>
</head>

/* ---------------- Difficulty (by game number) ---------------- */
function diffFor(g){
  const t=tierOf(g),k=((g-1)%10)/9,p=Math.max(1,(typeof SAVE_P==='function'?SAVE_P():1)),pm=1+.08*(p-1);
  const spd=Math.min(2.6,(.5+t*.16+.1*k)*pm);          /* enemies faster each city */
  const hp=(t===0?.5:.6+t*.12+.1*k)*pm;
  const sp=Math.min(3.2,(.55+t*.2+.1*k)*pm);           /* more enemies, faster spawn timer */
  const coin=2+t*.4+.2*k;                              /* bigger rewards each city */
  const ct=Math.max(1.9,3.4-t*.16);                    /* combo timer gets tighter */
  return{t,spd,hp,sp,coin,ct,lvl:g};
}

    noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    amb=AC.createOscillator();amb.type='sawtooth';amb.frequency.value=50;

}

  if(!AC||G.muted||voices>26)return;
  const p=pit===false?1:pitch(),t=AC.currentTime,Dd=dur/p;
  const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f*p,t);

}
function noise(dur,vol,fc,pit){
  if(!AC||G.muted||voices>26)return;
  const p=pit===false?1:pitch(),t=AC.currentTime,Dd=dur/p;
  const s=AC.createBufferSource();s.buffer=noiseBuf;s.playbackRate.value=p;
  const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=Math.max(80,fc*p);
  const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0008,t+Dd);
  s.connect(f);f.connect(g);g.connect(master);voices++;s.onended=()=>voices--;s.start(t);s.stop(t+Dd+.02);
}

function boom(x,y,R,dmg){

    if(d<R+e.r)dmgE(e,dmg*(1-d/(R+e.r)*.5),dx/d*260,dy/d*260)}

    if(d<R+p.r){if(p.k==='barrel'){if(p.fuse<0)p.fuse=.07+Math.random()*.06}else{p.vx+=dx/d*500;p.vy+=dy/d*500}}}

function chaseDir(){const h=homePos(),ep=G.ep,dx=h[0]-ep.x,dy=h[1]-ep.y,L=hyp(dx,dy)||1;return{ux:dx/L,uy:dy/L,L}}

function ebullet(x,y,a,sp,col){B.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:5,life:10,col:col||TH.bc})}
function beamHit(e){

function beamUpdate(e,ang,wdt,done){

/* ---------------- Launch ---------------- */
function launch(){
  const n=orbit.length;if(!n)return;let tot=0;
  for(let i=0;i<n;i++){
    const o=orbit[i],spread=(i-(n-1)/2)/n*.95+(Math.random()-.5)*.1,a=P.aim+spread,sp=(o.k==='safe'?900:1150)*rnd(.9,1.1);
    S.push({id:++SID,k:o.k,x:o.x,y:o.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:{safe:20,barrel:14,drone:12,bullet:6}[o.k],life:2.4,b:1,rot:o.rot||0,done:false,cool:0,last:null});
    tot+={safe:2.2,barrel:1.4,drone:1,bullet:.5}[o.k];
  }
  orbit=[];
  const imp=Math.min(950,260+tot*120);
  P.kx-=Math.cos(P.aim)*imp;P.ky-=Math.sin(P.aim)*imp;
  P.launchT=1.1;G.ts=1;G.shake=Math.max(G.shake,10+n*1.5);G.hs=.045;G.flash=Math.max(G.flash,.3);

/* ---------------- Projectile helpers ---------------- */
function endS(s,exp){

}
function hitS(s,e){

    if(hyp(s.vx,s.vy)<260)endS(s,false);

/* ---------------- Enemy AI ---------------- */
function moveE(e,wdt,tx,ty,k){
  const f=Math.min(1,wdt*k);
  e.vx+=(tx-e.vx)*f;e.vy+=(ty-e.vy)*f;
  e.x+=e.vx*wdt;e.y+=e.vy*wdt;
  e.x=clamp(e.x,e.r,Math.max(e.r,W-e.r));e.y=clamp(e.y,e.r,Math.max(e.r,H-e.r));
}
function kite(e,a,d,far,near,sp,wdt){
  const w=d>far?1:d<near?-1:0,st=Math.sin(e.ph*1.2)*.7;
  moveE(e,wdt,(Math.cos(a)*w-Math.sin(a)*st)*sp,(Math.sin(a)*w+Math.cos(a)*st)*sp,2.5);
}
function updateEnemies(dt,wdt){
  const sm=G.spd;
  for(const e of E){
    if(e.dead)continue;
    e.fl=Math.max(0,e.fl-dt);e.ph+=wdt;
    const dx=P.x-e.x,dy=P.y-e.y,d=hyp(dx,dy)||1,a=Math.atan2(dy,dx);
    if(e.t==='grunt'){
      kite(e,a,d,Math.min(340,W*.4),Math.min(220,W*.25),95*sm,wdt);
      e.cd-=wdt;
      if(e.cd<=0){e.cd=rnd(2,3.4)/Math.max(.75,sm);ebullet(e.x,e.y,a+rnd(-.08,.08),240*sm);sfx.shoot()}
    }else if(e.t==='heavy'){
      if(e.bs==='move'){
        kite(e,a,d,Math.min(400,W*.45),Math.min(280,W*.3),55*sm,wdt);
        e.cd-=wdt;e.bt-=wdt;
        if(e.cd<=0){e.cd=rnd(2.8,4.2)/Math.max(.75,sm);for(let i=-1;i<=1;i++)ebullet(e.x,e.y,a+i*.22,215*sm);sfx.shoot()}
        if(e.bt<=0){e.bs='aim';e.bt=1.6;e.ang=a}
      }else{
        moveE(e,wdt,0,0,4);
        beamUpdate(e,a,wdt,()=>{e.bs='move';e.bt=rnd(3.5,5.5)/Math.max(.8,sm)});
      }
    }else if(e.t==='drone'){
      const sp=115*sm;
      moveE(e,wdt,Math.cos(a)*sp+Math.sin(e.ph*5)*30*sm,Math.sin(a)*sp+Math.cos(e.ph*5)*30*sm,3);
      if(d<e.r+P.r){hurt();e.dead=true;burst(e.x,e.y,ECOL.drone,18,300,.5);sfx.hit();continue}
    }
    if(e.t!=='drone'&&d<e.r+P.r-3)hurt();
  }
}

/* ---------------- Main play update ---------------- */
function tutorialAction(next){if(!G.tut||G.tut.shown>=3)return;if(G.tut.pending!==-1){G.tut.pending=Math.max(G.tut.pending,next);return}if(next<=G.tut.shown)return;G.tut.pending=next;G.tut.fade=.52}
function play(dt){
  if(P.lock){P.lt=(P.lt||0)+dt;if(P.lt>.7){P.lock=false;P.lt=0}}
  const k=IN.keys;
  let ix=((k.KeyD||k.ArrowRight)?1:0)-((k.KeyA||k.ArrowLeft)?1:0)+IN.jx,
      iy=((k.KeyS||k.ArrowDown)?1:0)-((k.KeyW||k.ArrowUp)?1:0)+IN.jy;
  let mag=hyp(ix,iy);if(mag>1){ix/=mag;iy/=mag;mag=1}
  if(P.lock){ix=iy=0;mag=0}
  if(mag>.18&&G.tut&&!G.tut.moveDone){G.tut.moveDone=true;tutorialAction(1)}
  P.inv=Math.max(0,P.inv-dt);

  const pspd=300*(1+.5*(arenaK-1));
  P.x+=(ix*pspd+P.kx)*dt;P.y+=(iy*pspd+P.ky)*dt;
  const dk=Math.exp(-3*dt);P.kx*=dk;P.ky*=dk;
  if(P.x<P.r){P.x=P.r;P.kx=Math.abs(P.kx)*.3}
  if(P.x>W-P.r){P.x=W-P.r;P.kx=-Math.abs(P.kx)*.3}
  if(P.y<P.r){P.y=P.r;P.ky=Math.abs(P.ky)*.3}
  if(P.y>H-P.r){P.y=H-P.r;P.ky=-Math.abs(P.ky)*.3}
  P.aim=Math.atan2(IN.my-P.y,IN.mx-P.x);

  const want=(IN.down||k.Space)&&!P.lock;
  if(!want)P.exh=false;
  if(want&&!P.holding&&!P.exh&&P.en>8){P.holding=true;sfx.hold()}
  if(P.holding&&G.tut&&G.tut.moveDone&&!G.tut.holdDone){G.tut.holdDone=true;tutorialAction(2)}
  if(!want&&P.holding){P.holding=false;if(G.tut&&G.tut.holdDone)tutorialAction(3);launch()}
  if(P.holding){
    P.en-=26*dt;
    if(P.en<=0){P.en=0;P.holding=false;P.exh=true;launch()}
  }else P.en=Math.min(maxEn(),P.en+8*dt);

  const kn=Math.min(1,hyp(P.kx,P.ky)/450);
  let tgt=Math.max(.05,mag,kn);
  if(P.launchT>0){P.launchT-=dt;tgt=1}
  G.ts+=(tgt-G.ts)*Math.min(1,dt*(tgt>G.ts?14:5));
  const wdt=dt*G.ts,pdt=dt*(.25+.75*G.ts);
  G.gt+=wdt;
  const ramp=1+Math.min(.5,G.gt/180)*(D.t===0?.5:1);
  G.spd=Math.min(2.4,D.spd*(1+Math.min(.25,G.gt/400)));

  if(mag>.3&&Math.random()<.6&&PT.length<700)PT.push({x:P.x,y:P.y,vx:rnd(-30,30),vy:rnd(-30,30),l:0,m:.35,c:skinCol(),s:2});

  /* orbit */
  G.oa+=dt*3;
  const on=orbit.length,orad=on>4?48:36;
  for(let i=0;i<on;i++){const o=orbit[i],a=G.oa+i*TAU/on;o.x=P.x+Math.cos(a)*orad;o.y=P.y+Math.sin(a)*orad;o.rot=(o.rot||0)+dt*4}

  /* singularity pull */
  if(P.holding){
    const R=holeR(),rng=holeRange(),dm=Math.min(hyp(IN.mx-P.x,IN.my-P.y),rng);
    P.hx=P.x+Math.cos(P.aim)*dm;P.hy=P.y+Math.sin(P.aim)*dm;
    if(Math.random()<.5&&PT.length<700){const a=Math.random()*TAU;PT.push({x:P.hx+Math.cos(a)*R,y:P.hy+Math.sin(a)*R,vx:-Math.cos(a)*260,vy:-Math.sin(a)*260,l:0,m:.5,c:TH.ac2,s:2})}
    for(const p of PR){
      if(p.dead)continue;const dx=P.hx-p.x,dy=P.hy-p.y,d=hyp(dx,dy)||1;
      if(d<R){
        const f=(1-d/R)*1400+300;p.vx+=dx/d*f*pdt;p.vy+=dy/d*f*pdt;
        const dm2=Math.exp(-2*pdt);p.vx*=dm2;p.vy*=dm2;
        if(d<32&&orbit.length<cap()){orbit.push({k:p.k,rot:p.rot,x:p.x,y:p.y});p.dead=true;sfx.grab();burst(p.x,p.y,ICOL[p.k],8,160,.3)}
      }
    }
    for(const b of B){
      if(b.life<=0)continue;const dx=P.hx-b.x,dy=P.hy-b.y,d=hyp(dx,dy)||1;
      if(d<R){
        const f=(1-d/R)*1800+300;b.vx+=dx/d*f*pdt;b.vy+=dy/d*f*pdt;
        if(d<32&&orbit.length<cap()){orbit.push({k:'bullet',rot:0,x:b.x,y:b.y});b.life=0;sfx.grab()}
      }
    }
    for(const e of E){
      if(e.dead)continue;const dx=P.hx-e.x,dy=P.hy-e.y,d=hyp(dx,dy)||1;
      if(d<R){
        const f=e.t==='drone'?420:e.t==='grunt'?160:70;
        e.x+=dx/d*f*(1-d/R)*pdt;e.y+=dy/d*f*(1-d/R)*pdt;
        if(e.t==='drone'&&d<30&&orbit.length<cap()){orbit.push({k:'drone',rot:0,x:e.x,y:e.y});e.dead=true;sfx.grab();burst(e.x,e.y,ECOL.drone,12,200,.4)}
      }
    }
  }

  /* props */
  for(const p of PR){
    if(p.dead)continue;
    if(p.fuse>=0){p.fuse-=dt;if(p.fuse<=0){p.dead=true;boom(p.x,p.y,125,5);continue}}
    p.x+=p.vx*pdt;p.y+=p.vy*pdt;p.rot+=p.vr*pdt;
    const dm2=Math.exp(-1.2*pdt);p.vx*=dm2;p.vy*=dm2;
    if(p.x<p.r){p.x=p.r;p.vx=Math.abs(p.vx)*.6}
    if(p.x>W-p.r){p.x=W-p.r;p.vx=-Math.abs(p.vx)*.6}
    if(p.y<p.r){p.y=p.r;p.vy=Math.abs(p.vy)*.6}
    if(p.y>H-p.r){p.y=H-p.r;p.vy=-Math.abs(p.vy)*.6}
    const dx=p.x-P.x,dy=p.y-P.y,d=hyp(dx,dy)||1,rr=p.r+P.r+2;
    if(d<rr){p.x=P.x+dx/d*rr;p.y=P.y+dy/d*rr;p.vx+=dx/d*200;p.vy+=dy/d*200}
  }
  G.chainT-=dt;if(G.chainT<=0)G.chain=0;
  G.comboT-=dt;if(G.comboT<=0&&G.combo>0)G.combo=0;

  updateEnemies(dt,wdt);

  /* enemy bullets */
  for(const b of B){
    if(b.life<=0)continue;
    b.x+=b.vx*wdt;b.y+=b.vy*wdt;b.life-=wdt;
    if(b.x<-20||b.x>W+20||b.y<-20||b.y>H+20){b.life=0;continue}
    if(hyp(b.x-P.x,b.y-P.y)<b.r+P.r-2&&P.inv<=0){b.life=0;hurt();continue}
    for(const p of PR){if(!p.dead&&p.k==='barrel'&&p.fuse<0&&hyp(b.x-p.x,b.y-p.y)<p.r+b.r){p.fuse=.08;b.life=0;break}}
  }

  /* launched projectiles */
  for(const s of S){
    if(s.life<=0)continue;
    s.life-=wdt;s.x+=s.vx*wdt;s.y+=s.vy*wdt;s.rot+=wdt*8;
    if(s.cool>0)s.cool-=wdt;
    if(s.life<=0){endS(s,s.k==='barrel'||s.k==='drone');continue}
    let wall=false;
    if(s.x<s.r){s.x=s.r;s.vx=Math.abs(s.vx);wall=true}
    else if(s.x>W-s.r){s.x=W-s.r;s.vx=-Math.abs(s.vx);wall=true}
    if(s.y<s.r){s.y=s.r;s.vy=Math.abs(s.vy);wall=true}
    else if(s.y>H-s.r){s.y=H-s.r;s.vy=-Math.abs(s.vy);wall=true}
    if(wall){
      if(s.k==='barrel'||s.k==='drone'){endS(s,true);continue}
      if(s.b>0){s.b--;sfx.hit();burst(s.x,s.y,ICOL[s.k],6,160,.3)}
      else{endS(s,false);continue}
    }
    for(const e of E){
      if(e.dead)continue;
      if(s.last===e&&s.cool>0)continue;
      if(hyp(e.x-s.x,e.y-s.y)<e.r+s.r){hitS(s,e);if(s.life<=0)break}
    }
    if(s.life<=0)continue;
    for(const p of PR){
      if(p.dead||hyp(p.x-s.x,p.y-s.y)>=p.r+s.r)continue;
      if(p.k==='barrel'){
        if(p.fuse<0)p.fuse=.06;
        if(s.k!=='safe'){endS(s,s.k!=='bullet');break}
      }else{
        p.vx+=s.vx*.4;p.vy+=s.vy*.4;
        if(s.k==='bullet'){endS(s,false);break}
      }
    }
  }

  /* END POINT: kill quota -> opens -> collect it -> return to the start zone -> next game */
  {const ep=G.ep,open=epOpenNow();ep.t+=wdt;
   if(open&&!ep.was){ep.was=true;if(D.t>0){sfx.win();G.banner={txt:'END POINT OPEN!',sub:'Go to it, collect it, then return',t:2.4};burst(ep.x,ep.y,TH.ac2,30,300,.8)}}
   if(open&&!ep.got&&hyp(P.x-ep.x,P.y-ep.y)<ep.r+P.r){ep.got=true;sfx.combo();popup(ep.x,ep.y-40,'COLLECTED!','#ffd23a',24);burst(ep.x,ep.y,'#ffd23a',40,380,.9);
     if(G.gn>=11){{const c0=chaseDir(),tx=c0.ux>0?ep.x/c0.ux:c0.ux<0?(W-ep.x)/-c0.ux:1e9,ty=c0.uy>0?ep.y/c0.uy:c0.uy<0?(H-ep.y)/-c0.uy:1e9;G.ch={d:-Math.min(tx,ty)+14}}G.banner={txt:'RUN!',sub:'The red wall is chasing you',t:2};sfx.laser();G.shake=Math.max(G.shake,10)}}
   if(G.ch&&G.ep.got){const c=chaseDir(),pspd=300*(1+.5*(arenaK-1)),f=Math.min(.9,.4+.5*(G.gn-11)/89);
     G.ch.d+=pspd*f*dt;
     if((P.x-ep.x)*c.ux+(P.y-ep.y)*c.uy<G.ch.d+P.r){P.hp=0;G.flash=1;G.shake=30;die();return}}
   if(ep.got&&G.kills>=G.need){const h=homePos();if(hyp(P.x-h[0],P.y-h[1])<46)finishGame()}}
  /* endless spawner: faster + tougher with game number and time */
  G.spT-=wdt;
  if(G.spT<=0){
    G.spT=2.8/(D.sp*ramp);
    const maxE=Math.min(14+D.t*2,3+Math.floor(D.sp*3*ramp));
    if(E.length<maxE&&(D.t===0||G.kills<G.need))spawnEnemy();
  }
  G.supT-=wdt;
  if(G.supT<=0){
    G.supT=rnd(3.5,6);
    if(PR.filter(p=>!p.dead).length<12+D.t*2)addProp(Math.random()<.5?'barrel':'safe',rnd(60,W-60),rnd(60,H-60));
  }

  G.saveT+=dt;if(G.saveT>4){G.saveT=0;saveSafe()}

  E=E.filter(e=>!e.dead);PR=PR.filter(p=>!p.dead);B=B.filter(b=>b.life>0);S=S.filter(s=>s.life>0);
  fx(dt);
}

function update(dt){
  G.t+=dt;audioTick();
  if(G.tut&&G.tut.pending!==-1){G.tut.fade=Math.max(0,G.tut.fade-dt);if(G.tut.fade===0){G.tut.shown=G.tut.pending;G.tut.pending=-1;if(G.tut.shown>=3)G.tut=null}}
  bgx+=(20+160*G.ts)*dt;
  updConfetti(dt);
  if(G.state==='play'){
    if(G.paused)return;
    if(G.hs>0){G.hs-=dt;return}
    play(dt);
  }else if(G.state==='dead'){
    G.ts+=(.35-G.ts)*Math.min(1,dt*3);fx(dt);
  }else{

/* =====================================================================
   RENDERING
   ===================================================================== */
const neon=(c,b)=>{ctx.shadowColor=c;ctx.shadowBlur=b};
const noGlow=()=>{ctx.shadowBlur=0};
function circ(x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,TAU)}
function poly(x,y,n,r,rot){ctx.beginPath();for(let i=0;i<n;i++){const a=rot+i*TAU/n,px=x+Math.cos(a)*r,py=y+Math.sin(a)*r;i?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.closePath()}
function txt(s,x,y,sz,col,al,glow){
  ctx.font='700 '+sz+'px "Trebuchet MS",system-ui,sans-serif';ctx.textAlign=al||'left';ctx.textBaseline='middle';ctx.fillStyle=col;
  if(glow){ctx.shadowColor=glow;ctx.shadowBlur=10}
  ctx.fillText(s,x,y);ctx.shadowBlur=0;
}

function drawBG(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,TH.bg1);g.addColorStop(1,TH.bg2);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle=TH.star;
  for(const s of STARS){
    const x=(((s.x*W-bgx*s.z*.4)%W)+W)%W;
    ctx.globalAlpha=.25+.5*Math.abs(Math.sin(s.p+G.t*s.z));
    ctx.fillRect(x,s.y*H,1.6*s.z+.6,1.6*s.z+.6);
  }
  ctx.globalAlpha=1;
  ctx.strokeStyle=`rgba(${TH.acr},.08)`;ctx.lineWidth=1;ctx.beginPath();
  const o=(((-bgx*.6)%80)+80)%80;
  for(let x=o;x<W;x+=80){ctx.moveTo(x,0);ctx.lineTo(x,H)}
  for(let y=0;y<H;y+=80){ctx.moveTo(0,y);ctx.lineTo(W,y)}
  ctx.stroke();
}

function drawObj(k,x,y,rot,fuse,s){
  s=s||1;
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(s,s);
  const col=ICOL[k];neon(col,19);ctx.lineWidth=4;ctx.strokeStyle='#fff';
  if(k==='safe'){
    ctx.fillStyle='rgba(25,45,110,.92)';ctx.fillRect(-18,-18,36,36);ctx.strokeRect(-18,-18,36,36);
    noGlow();ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-18,-18);ctx.lineTo(18,18);ctx.moveTo(18,-18);ctx.lineTo(-18,18);ctx.stroke();
    ctx.fillStyle=col;circ(0,0,5);ctx.fill();
  }else if(k==='barrel'){
    const fl=fuse>=0&&Math.floor(G.t*30)%2===0;
    ctx.fillStyle=fl?'#fff':'rgba(30,60,10,.95)';circ(0,0,15);ctx.fill();ctx.stroke();
    noGlow();ctx.strokeStyle=fl?'#f60':col;ctx.lineWidth=2.5;
    ctx.beginPath();ctx.moveTo(-9,-3);ctx.lineTo(9,-3);ctx.moveTo(-9,3);ctx.lineTo(9,3);ctx.stroke();
  }else if(k==='drone'){
    poly(0,0,4,12,0);ctx.fillStyle='rgba(50,10,70,.95)';ctx.fill();ctx.stroke();
  }else{
    ctx.fillStyle=col;circ(0,0,6);ctx.fill();
  }
  noGlow();ctx.restore();
}

function drawEnemy(e){
  const a=Math.atan2(P.y-e.y,P.x-e.x),col=ECOL[e.t],f=e.fl>0,k=e.t==='heavy'?1.5:e.t==='drone'?.8:1;
  ctx.save();ctx.translate(e.x,e.y);ctx.rotate(a);ctx.scale(k,k);   /* same triangle ship as the player, facing the player */
  neon(col,20);
  const g=ctx.createLinearGradient(-10,0,16,0);g.addColorStop(0,'rgba(20,6,24,.9)');g.addColorStop(1,col);
  ctx.fillStyle=f?'#fff':g;ctx.strokeStyle=f?'#fff':col;ctx.lineWidth=2.6;
  ctx.beginPath();ctx.moveTo(15,0);ctx.lineTo(-11,-11);ctx.lineTo(-5,0);ctx.lineTo(-11,11);ctx.closePath();ctx.fill();ctx.stroke();
  noGlow();ctx.fillStyle='#fff';circ(1,0,4.2);ctx.fill();ctx.strokeStyle='#06101d';ctx.lineWidth=1.2;circ(1,0,4.2);ctx.stroke();
  ctx.restore();
  if(e.hp<e.mhp){
    ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(e.x-16,e.y-e.r-12,32,4);
    ctx.fillStyle=col;ctx.fillRect(e.x-16,e.y-e.r-12,32*Math.max(0,e.hp/e.mhp),4);
  }
}

/* big red chasing wall (games 6+, starts when the End Point is collected) */
function drawChase(){
  if(!G.ch||!G.ep||G.state!=='play')return;
  const c=chaseDir(),d=G.ch.d,ep=G.ep;

  const g=ctx.createLinearGradient(d-150,0,d,0);g.addColorStop(0,'rgba(255,0,20,0)');g.addColorStop(1,'rgba(255,20,40,.75)');
  ctx.fillStyle=g;ctx.fillRect(d-150,-4000,150,8000);

}

/* End Point + return zone */
function drawEndPoint(){
  const ep=G.ep;if(!ep||(G.state!=='play'&&G.state!=='done'))return;
  const open=epOpenNow(),t=ep.t;
  if(!ep.got){
    ctx.save();ctx.translate(ep.x,ep.y);
    const c=open?'#ffd23a':'#6a7a90';neon(c,open?26:6);ctx.lineWidth=3;ctx.strokeStyle=c;
    circ(0,0,ep.r);ctx.stroke();
    ctx.rotate(t*(open?1.4:.2));ctx.setLineDash([10,8]);circ(0,0,ep.r-9);ctx.stroke();ctx.setLineDash([]);
    ctx.rotate(-t*(open?1.4:.2));noGlow();
    if(open){ctx.fillStyle='rgba(255,210,58,'+(.25+.2*Math.sin(t*5))+')';circ(0,0,ep.r-12);ctx.fill();ctx.fillStyle='#ffd23a';poly(0,0,4,8,Math.PI/4);ctx.fill()}
    else{ctx.fillStyle='#6a7a90';ctx.fillRect(-8,-3,16,12);ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,-3,6,Math.PI,0);ctx.stroke()}
    ctx.restore();
    txt(open?'END POINT':'LOCKED',ep.x,ep.y+ep.r+16,13,open?'#ffd23a':'#8fb0cc','center',open?'#ffd23a':null);
  }else{
    const hx=homePos()[0],hy=homePos()[1],ready=G.kills>=G.need,c=ready?'#5dff9a':'#6a7a90';
    ctx.save();neon(c,ready?24:4);ctx.lineWidth=3;ctx.strokeStyle=c;ctx.setLineDash([10,8]);ctx.lineDashOffset=-t*20;circ(hx,hy,46);ctx.stroke();ctx.restore();
    txt(ready?'RETURN HERE':'KILL '+(G.need-G.kills)+' MORE',hx,hy+(LAY()==='V'?62:-62),14,c,'center',ready?c:null);
  }
}

function drawBeams(){
  for(const e of E){
    if(e.dead||(e.bs!=='aim'&&e.bs!=='fire'))continue;
    const ex=e.x+Math.cos(e.ang)*5000,ey=e.y+Math.sin(e.ang)*5000;
    ctx.save();
    if(e.bs==='aim'){
      const k=1-clamp(e.bt/1.6,0,1);
      ctx.strokeStyle=`rgba(255,80,120,${.4+.55*k})`;ctx.lineWidth=2.5+k*2.5;ctx.setLineDash([12,9]);
      ctx.beginPath();ctx.moveTo(e.x,e.y);ctx.lineTo(ex,ey);ctx.stroke();
    }else{
      neon('#ff2040',30);ctx.strokeStyle='#ff244f';ctx.lineWidth=17;
      ctx.beginPath();ctx.moveTo(e.x,e.y);ctx.lineTo(ex,ey);ctx.stroke();
      ctx.strokeStyle='#fff';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(e.x,e.y);ctx.lineTo(ex,ey);ctx.stroke();
    }
    ctx.restore();
  }
}

function drawHole(){
  if(!P.holding)return;
  const R=holeR(),x=P.hx,y=P.hy;
  ctx.save();
  ctx.strokeStyle=`rgba(${TH.ac2r},.4)`;ctx.lineWidth=1.5;ctx.setLineDash([6,8]);circ(x,y,R);ctx.stroke();ctx.setLineDash([]);
  ctx.strokeStyle=`rgba(${TH.ac2r},.28)`;ctx.beginPath();ctx.moveTo(P.x,P.y);ctx.lineTo(x,y);ctx.stroke();
  const g=ctx.createRadialGradient(x,y,2,x,y,R*.55);g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(.35,'rgba(10,0,30,.92)');g.addColorStop(1,`rgba(${TH.ac2r},0)`);
  ctx.fillStyle=g;circ(x,y,R*.55);ctx.fill();
  neon(TH.ac2,12);ctx.lineWidth=2.5;ctx.strokeStyle=`rgba(${TH.ac2r},.85)`;
  for(let i=0;i<3;i++){
    ctx.beginPath();
    for(let t=0;t<=1.001;t+=.08){const a=G.t*5+i*2.094+t*4,r=R*.55*(1-t*.9);const px=x+Math.cos(a)*r,py=y+Math.sin(a)*r;t?ctx.lineTo(px,py):ctx.moveTo(px,py)}

}

function drawPlayer(){
  ctx.save();ctx.translate(P.x,P.y);
  ctx.strokeStyle='rgba(255,255,255,.72)';ctx.lineWidth=2.2;ctx.setLineDash([3,6]);
  ctx.beginPath();ctx.moveTo(Math.cos(P.aim)*20,Math.sin(P.aim)*20);ctx.lineTo(Math.cos(P.aim)*70,Math.sin(P.aim)*70);ctx.stroke();ctx.setLineDash([]);
  if(orbit.length){ctx.strokeStyle=`rgba(${TH.acr},.2)`;circ(0,0,orbit.length>4?48:36);ctx.stroke()}
  ctx.rotate(P.aim);
  if(P.inv>0&&Math.floor(G.t*20)%2===0)ctx.globalAlpha=.35;
  const c1=skinCol(),c2=skinCol2();

  const g=ctx.createLinearGradient(-10,0,16,0);g.addColorStop(0,c2);g.addColorStop(1,c1);

}

function drawWorld(){
  for(const p of PR)if(!p.dead)drawObj(p.k,p.x,p.y,p.rot,p.fuse,1);
  drawEndPoint();drawChase();
  drawBeams();
  for(const e of E)if(!e.dead)drawEnemy(e);
  for(const b of B){
    if(b.life<=0)continue;
    ctx.save();neon(b.col,12);ctx.fillStyle=b.col;circ(b.x,b.y,b.r);ctx.fill();noGlow();ctx.fillStyle='#fff';circ(b.x,b.y,2);ctx.fill();ctx.restore();
  }
  for(const s of S){
    if(s.life<=0)continue;
    const sp=hyp(s.vx,s.vy)||1;
    ctx.save();ctx.strokeStyle=ICOL[s.k];ctx.globalAlpha=.5;ctx.lineWidth=s.r;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(s.x-s.vx/sp*s.r*3.5,s.y-s.vy/sp*s.r*3.5);ctx.stroke();ctx.restore();
    drawObj(s.k,s.x,s.y,s.rot,-1,1);
  }
  for(const o of orbit)drawObj(o.k,o.x,o.y,o.rot||0,-1,.62);
  drawHole();
  if(G.state==='play'||G.state==='done')drawPlayer();
  for(const x of X){
    const k=clamp(x.t/x.life,0,1),r=Math.max(1,x.max*(1-Math.pow(1-k,3)));
    ctx.save();ctx.globalAlpha=1-k;
    const g=ctx.createRadialGradient(x.x,x.y,0,x.x,x.y,r);
    g.addColorStop(0,'rgba(255,255,255,.9)');
    g.addColorStop(.5,x.v?`rgba(${TH.ac2r},.55)`:`rgba(${TH.acr},.5)`);
    g.addColorStop(1,`rgba(${TH.ac2r},0)`);
    ctx.fillStyle=g;circ(x.x,x.y,r);ctx.fill();
    ctx.strokeStyle=x.v?TH.ac2:TH.ac;ctx.lineWidth=3;circ(x.x,x.y,r*.9);ctx.stroke();
    ctx.restore();
  }
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(const p of PT){ctx.globalAlpha=clamp(1-p.l/p.m,0,1);ctx.fillStyle=p.c;ctx.fillRect(p.x-p.s/2,p.y-p.s/2,p.s,p.s)}
  ctx.restore();
  for(const p of PP){ctx.globalAlpha=clamp(1.3-p.l,0,1);txt(p.t,p.x,p.y,p.s,p.c,'center',p.c)}
  ctx.globalAlpha=1;
}

/* ---------------- Zero-text first-game visual onboarding ---------------- */
function drawTutorial(){
  const t=G.tut;if(!t||G.state!=='play'||G.paused)return;
  const stage=t.shown;
  const alpha=t.pending!==-1?clamp(t.fade/.52,0,1):1;
  if(alpha<=0||stage>2)return;
  const pulse=1+Math.sin(G.t*5.5)*.12,ring=26*pulse;
  ctx.save();ctx.globalAlpha=alpha;ctx.lineCap='round';ctx.lineJoin='round';
  const stroke=(x,y,r,col,w=3)=>{ctx.strokeStyle=col;ctx.lineWidth=w;ctx.shadowColor=col;ctx.shadowBlur=16;circ(x,y,r);ctx.stroke();ctx.shadowBlur=0};
  const arrow=(x1,y1,x2,y2,col)=>{const a=Math.atan2(y2-y1,x2-x1);ctx.strokeStyle=col;ctx.lineWidth=4;ctx.shadowColor=col;ctx.shadowBlur=14;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-Math.cos(a-.55)*13,y2-Math.sin(a-.55)*13);ctx.lineTo(x2-Math.cos(a+.55)*13,y2-Math.sin(a+.55)*13);ctx.closePath();ctx.fillStyle=col;ctx.fill();ctx.shadowBlur=0};
  if(stage===0){
    stroke(P.x,P.y,ring+8,'#00f5ff',3);
    for(let i=0;i<4;i++){const a=i*Math.PI/2+G.t*.35,x=P.x+Math.cos(a)*65,y=P.y+Math.sin(a)*65;arrow(x-Math.cos(a)*15,y-Math.sin(a)*15,x+Math.cos(a)*12,y+Math.sin(a)*12,'#7dffff')}
    stroke(P.x,P.y,54+Math.sin(G.t*4)*5,'rgba(0,245,255,.5)',1.5);
  }else if(stage===1){
    let target=null,best=Infinity;for(const p of PR){if(p.dead)continue;const d=hyp(p.x-P.x,p.y-P.y);if(d<best&&d<420){best=d;target=p}}
    if(target){const x=target.x,y=target.y;stroke(x,y,ring+10,'#c58aff',3);stroke(x,y,ring+27,'rgba(197,138,255,.6)',2);
      for(let i=0;i<4;i++){const a=G.t*1.8+i*Math.PI/2,s=ring+58;arrow(x+Math.cos(a)*s,y+Math.sin(a)*s,x+Math.cos(a)*(ring+17),y+Math.sin(a)*(ring+17),'#d9b4ff')}
      arrow(P.x+Math.cos(P.aim)*42,P.y+Math.sin(P.aim)*42,x-Math.cos(P.aim)*35,y-Math.sin(P.aim)*35,'rgba(197,138,255,.8)');
    }else stroke(P.x+Math.cos(P.aim)*100,P.y+Math.sin(P.aim)*100,ring,'#c58aff',3);
  }else{
    let target=null,best=Infinity;for(const e of E){if(e.dead)continue;const d=hyp(e.x-P.x,e.y-P.y);if(d<best){best=d;target=e}}
    if(target){stroke(target.x,target.y,ring+14,'#ffdf63',3);stroke(target.x,target.y,ring+31,'rgba(255,223,99,.55)',2);arrow(P.x+Math.cos(P.aim)*32,P.y+Math.sin(P.aim)*32,target.x,target.y,'#ffe77b');
      ctx.strokeStyle='rgba(255,231,123,.8)';ctx.lineWidth=2;ctx.setLineDash([8,9]);ctx.beginPath();ctx.moveTo(P.x,P.y);ctx.lineTo(target.x,target.y);ctx.stroke();ctx.setLineDash([]);
    }
  }
  ctx.restore();
}

function draw(){

  c.setTransform(DPR*SC,0,0,DPR*SC,0,0);
  c.save();
  if(G.shake>0)c.translate(rnd(-1,1)*G.shake,rnd(-1,1)*G.shake);
  drawBG();drawWorld();drawTutorial();drawTouch();
  c.restore();
  const slow=clamp(1-G.ts,0,1);
  if(slow>.05&&G.state==='play'){c.fillStyle=`rgba(${TH.ac2r},${slow*.08})`;c.fillRect(0,0,W,H)}
  if(G.flash>0){c.fillStyle=`rgba(255,240,250,${clamp(G.flash,0,1)*.3})`;c.fillRect(0,0,W,H)}
  const vg=c.createRadialGradient(W/2,H/2,Math.min(W,H)*.45,W/2,H/2,Math.max(W,H)*.65);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,10,.5)');
  c.fillStyle=vg;c.fillRect(0,0,W,H);
  /* HUD layer: fixed on-screen size regardless of arena size */
  const sW=W,sH=H;W=HW;H=HH;c.setTransform(DPR*HS,0,0,DPR*HS,0,0);
  drawHUD();
  if(G.paused&&G.state==='play'){
    c.fillStyle='rgba(2,2,14,.72)';c.fillRect(0,0,W,H);
    txt(T('paused'),W/2,H/2-14,52,'#fff','center',TH.ac);
    txt(IN.touch?T('tap'):T('click'),W/2,H/2+36,16,'#8fb0cc','center');
  }
  drawConfetti();
  c.strokeStyle=`rgba(${TH.acr},.2)`;c.lineWidth=2;c.strokeRect(1,1,W-2,H-2);
  W=sW;H=sH;
}

/* =====================================================================
   UI / SHOP / FLOW
   ===================================================================== */
function hideAll(){['title','shop','dead','lvl','win'].forEach(id=>$(id).classList.remove('show'))}
function refreshTitle(){
  $('tBest').textContent=T('best',SAVE.hi);
  $('bPlay').textContent=SAVE.games>0?T('playL',SAVE.games+1):T('play');
  $('tInfo').textContent=T('cityS',tierOf(SAVE.games+1)+1)+' · '+T('lvS',SAVE.games+1)+(SAVE.prestige>1?' · '+T('pres',SAVE.prestige):'');
}
function show(id){
  hideAll();$(id).classList.add('show');
  if(id==='title')refreshTitle();
}
function fillDead(){
  $('dSum').innerHTML=`${T('score')} <b>${G.lastScore}</b>${G.lastWasNew?' <span class="gold">'+T('newB')+'</span>':''}<br>${T('best',SAVE.hi)}<br><span class="gold">+${G.earned} ◈</span> ${T('earned')} · ${T('total')} ◈ ${SAVE.credits}<br><small>${T('cityS',D.t+1)} · ${T('lvS',G.gn)}<br>${T('left',10-(SAVE.games%10))}</small>`;
}
function showDead(){fillDead();show('dead')}
function fillLvl(){
  const t=tierOf(SAVE.games+1);
  $('lH2').textContent=T('welcome',cityName(t));
  $('lSum').innerHTML=`${T('score')} <b>${G.lastScore}</b> · ${T('best',SAVE.hi)}<br><span class="gold">+${G.earned} ◈</span><br><small>${T('cityS',t+1)} · ${T('lvS',SAVE.games+1)} · ${T('lvlNote')}</small>`;
}
function showLevelUp(){
  applyTheme(tierOf(SAVE.games+1));fillLvl();
  show('lvl');sfx.win();G.flash=.8;confetti(180);
  for(let i=1;i<=4;i++)setTimeout(()=>{if($('lvl').classList.contains('show'))confetti(60)},i*700);
}
function fillWin(){
  $('wSum').innerHTML=`${T('score')} <b>${G.lastScore}</b> · ${T('best',SAVE.hi)}<br><span class="gold">${T('bonus')}</span><br><small>${T('presU',SAVE.prestige)}</small>`;
  $('wPlay').textContent=T('startP',SAVE.prestige);
}
function showWin(){
  applyTheme(0);fillWin();
  show('win');sfx.win();G.flash=.9;confetti(240);
  for(let i=1;i<=8;i++)setTimeout(()=>{if($('win').classList.contains('show'))confetti(80)},i*600);
}
function togglePause(force){
  if(G.state!=='play')return;
  const np=force===undefined?!G.paused:force;
  if(np===G.paused)return;
  G.paused=np;IN.down=false;
}

const UPG=[
  {k:'mass',n:'uMass',d:'uMassD'},
  {k:'orbit',n:'uOrb',d:'uOrbD'},
  {k:'energy',n:'uEn',d:'uEnD'}
];
const upCost=l=>Math.round(100*Math.pow(1.75,l));
let shopMode='title';
function renderShop(){
  $('shC').textContent=SAVE.credits;
  $('shGo').textContent=shopMode==='dead'?T('again'):T('back');
  $('shU').innerHTML=UPG.map(u=>{
    const l=SAVE[u.k],max=l>=5,c=upCost(l);let pips='';
    for(let i=0;i<5;i++)pips+=`<i class="${i<l?'on':''}"></i>`;
    return `<div class="card"><b>${T(u.n)}</b><small>${T(u.d)}</small><div class="pips">${pips}</div><button class="btn sm" data-u="${u.k}" ${max||SAVE.credits<c?'disabled':''}>${max?T('max'):T('upg',c)}</button></div>`;
  }).join('');
  $('shK').innerHTML=SKINS.map((s,i)=>{
    const own=SAVE.owned.includes(i),sel=SAVE.skin===i;
    const bg=s.c==='rainbow'?'conic-gradient(#f33,#ff3,#3f3,#3ff,#33f,#f3f,#f33)':`linear-gradient(135deg,${s.c},${s.c2})`;
    const col=s.c==='rainbow'?'#fff':s.c;
    return `<div class="card ${sel?'sel':''}"><div class="sw" style="background:${bg};color:${col}"></div><b>${skinName(i)}</b><button class="btn sm" data-s="${i}" ${sel||(!own&&SAVE.credits<s.p)?'disabled':''}>${sel?T('eqd'):own?T('eq'):T('buy',s.p)}</button></div>`;
  }).join('');
}
function openShop(mode){
  shopMode=mode;
  if(G.state!=='play')G.state='shop';
  renderShop();show('shop');
}
$('shU').addEventListener('click',e=>{
  const b=e.target.closest('[data-u]');if(!b||b.disabled)return;
  const k=b.dataset.u,l=SAVE[k],c=upCost(l);
  if(l>=5||SAVE.credits<c)return;
  SAVE.credits-=c;SAVE[k]=l+1;save();sfx.pick();renderShop();
});
$('shK').addEventListener('click',e=>{
  const b=e.target.closest('[data-s]');if(!b||b.disabled)return;
  const i=+b.dataset.s,s=SKINS[i];
  if(!SAVE.owned.includes(i)){if(SAVE.credits<s.p)return;SAVE.credits-=s.p;SAVE.owned.push(i)}
  SAVE.skin=i;save();sfx.pick();renderShop();
});
$('shGo').onclick=()=>{
  unlock();sfx.ui();
  if(shopMode==='title'){G.state='title';show('title')}
  else startRun();
};
$('bPlay').onclick=()=>{unlock();sfx.ui();startRun()};
$('bShop').onclick=()=>{unlock();sfx.ui();openShop('title')};
$('dRetry').onclick=()=>{unlock();sfx.ui();startRun()};
$('dShop').onclick=()=>{unlock();sfx.ui();openShop('dead')};
$('lPlay').onclick=()=>{unlock();sfx.ui();startRun()};
$('wPlay').onclick=()=>{unlock();sfx.ui();startRun()};

/* ---------------- Share score (copies text to clipboard) ---------------- */
function copyText(s,btn){
  const old=btn.textContent;
  const ok=()=>{btn.textContent=T('copied');setTimeout(()=>{btn.textContent=old},1600)};
  const fallback=()=>{
    try{const t=document.createElement('textarea');t.value=s;t.style.cssText='position:fixed;left:-999px;top:0';document.body.appendChild(t);t.focus();t.select();document.execCommand('copy');document.body.removeChild(t);ok()}
    catch(e){btn.textContent=T('copyF')}
  };
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(s).then(ok,fallback);else fallback();
}
const shareMsg=n=>T('shareM',n);
$('bShare').onclick=e=>{unlock();sfx.ui();copyText(shareMsg(SAVE.hi),e.currentTarget)};
$('dShare').onclick=e=>{unlock();sfx.ui();copyText(shareMsg(G.lastScore),e.currentTarget)};
$('wShare').onclick=e=>{unlock();sfx.ui();copyText(shareMsg(G.lastScore),e.currentTarget)};
$('lShare').onclick=e=>{unlock();sfx.ui();copyText(shareMsg(G.lastScore),e.currentTarget)};

/* ---------------- Daily bonus: 100 coins + 1 free upgrade ---------------- */
function todayKey(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function checkDaily(){
  const t=todayKey();if(SAVE.lastDaily===t)return;
  SAVE.lastDaily=t;SAVE.credits+=100;
  const opts=UPG.filter(u=>SAVE[u.k]<5);let line;
  if(opts.length){const u=opts[(Math.random()*opts.length)|0];SAVE[u.k]++;line=T('freeUp',T(u.n))}
  else{SAVE.credits+=150;line=T('maxed')}
  save();
  $('dyTxt').innerHTML=`<b class="gold">+100 ◈</b><br>${line}`;
  $('daily').classList.add('show');
  confetti(80);
}
$('dyGo').onclick=()=>{unlock();sfx.pick();$('daily').classList.remove('show');refreshTitle()}

/* ---------------- Sound + Rotate/Fullscreen buttons ---------------- */
function syncSnd(){$('bSnd').textContent=userMuted?'🔇':'🔊'}
$('bSnd').onclick=()=>{unlock();userMuted=!userMuted;SAVE.muted=userMuted;saveSafe();applyAudioMute();syncSnd();if(!userMuted)sfx.ui()};
$('bRot').onclick=async()=>{
  unlock();
  const act=innerWidth>innerHeight?'landscape':'portrait';
  const vis=ROT?(act==='landscape'?'portrait':'landscape'):act;   /* what the player sees now */
  const want=vis==='landscape'?'portrait':'landscape';
  const de=document.documentElement;
  try{
    if(!document.fullscreenElement&&!document.webkitFullscreenElement){
      const f=de.requestFullscreen||de.webkitRequestFullscreen;if(f)await f.call(de,{navigationUI:'hide'});
    }
  }catch(e){}
  LOCKED=false;
  try{if(screen.orientation&&screen.orientation.lock){await screen.orientation.lock(want);LOCKED=true}}catch(e){LOCKED=false}
  WANT=want;resize();
  setTimeout(resize,150);setTimeout(resize,500);
};

/* ---------------- Language selector ---------------- */
function applyLang(){
  const st=$('stage');
  st.classList.toggle('ar',LANG==='ar');
  document.documentElement.lang=LANG;
  document.querySelectorAll('.ov').forEach(o=>{o.dir=LANG==='ar'?'rtl':'ltr'});
  document.querySelectorAll('[data-i]').forEach(el=>{el.innerHTML=T(el.dataset.i)});
  refreshTitle();
  if($('shop').classList.contains('show'))renderShop();
  if($('dead').classList.contains('show'))fillDead();
  if($('lvl').classList.contains('show'))fillLvl();
  if($('win').classList.contains('show'))fillWin();
}
function buildLang(){
  $('lgList').innerHTML=LANGS.map(([c,n])=>`<button class="btn${c===LANG?' sel':''}" data-l="${c}">${n}</button>`).join('');
}
function openLang(){unlock();sfx.ui();buildLang();$('lang').classList.add('show')}
$('lgList').addEventListener('click',e=>{
  const b=e.target.closest('[data-l]');if(!b)return;
  unlock();sfx.ui();LANG=b.dataset.l;SAVE.lang=LANG;saveSafe();applyLang();
  $('lang').classList.remove('show');
});
$('bLang').onclick=openLang;$('bLang2').onclick=openLang;
$('lgBack').onclick=()=>{unlock();sfx.ui();$('lang').classList.remove('show')};

/* ---------------- Boot ---------------- */
let lastT=performance.now();
function frame(now){
  const dt=Math.min(.05,Math.max(0,(now-lastT)/1000));lastT=now;
  try{update(dt);draw()}catch(err){console.error(err)}
  requestAnimationFrame(frame);
}
userMuted=!!SAVE.muted;applyAudioMute();syncSnd();applyLang();
applyTheme(tierOf(SAVE.games+1));
resize();
show('title');
checkDaily();
requestAnimationFrame(frame);
</script>
